# =============================================================================
# Auto-release on Dependabot merge
# =============================================================================
# After a Dependabot PR auto-merges to main, call the org-shared release
# workflow to bump the version, tag, and create a GitHub Release. The
# release event then fires publish.yml, which publishes to npm.
#
# Mirrors the structure of the sibling `dependabot-handler.yml`, which
# is the same pattern (reusable-workflow caller from de-otio/.github,
# gated on Dependabot authorship) and registers correctly. The previous
# version of this file used a multi-line `|` block scalar for the `if:`
# expression on the `uses:` job; GitHub's workflow parser rejected
# every push with a 0s "workflow file issue" failure. Single-line `if:`
# parses correctly.
# =============================================================================

name: Auto-release on Dependabot merge

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    if: github.event.head_commit.author.username == 'dependabot[bot]' && !contains(github.event.head_commit.message, '[skip ci]')
    uses: de-otio/.github/.github/workflows/dependabot-release-on-bump.yml@main
    secrets: inherit
