# =============================================================================
# Dependabot auto-merge
# =============================================================================
# Calls the org-shared workflow, which enables auto-merge for semver-minor and
# semver-patch Dependabot bumps once the required checks pass. Majors wait for
# a human. See https://github.com/de-otio/.github for the implementation and
# threat model.
# =============================================================================

name: Dependabot review

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

# Cancel superseded runs when Dependabot rebases a PR. Keyed on the PR number:
# under pull_request_target, github.ref is the BASE branch, so a ref-keyed group
# puts every Dependabot PR in one group and each run cancels the others.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  review:
    if: github.actor == 'dependabot[bot]'
    uses: de-otio/.github/.github/workflows/dependabot-claude-review.yml@main
    secrets: inherit
